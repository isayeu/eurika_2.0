<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eurika</title>
  </head>
  <body>
    <header>
      <strong>Eurika</strong>
      <button id="open-workspace">Open workspace</button>
      <button id="refresh-files">Refresh files</button>
      <select id="checkpoint-select" aria-label="Checkpoint">
        <option value="">No checkpoints</option>
      </select>
      <button id="restore-checkpoint">Restore checkpoint</button>
      <span id="workspace">No workspace</span>
      <span id="status">stopped</span>
    </header>
    <div id="error-banner" hidden></div>
    <main>
      <aside id="files"></aside>
      <section id="editor-pane">
        <div id="tabs"></div>
        <div id="editor"></div>
        <div id="terminal"></div>
        <form id="terminal-form">
          <input id="terminal-command" placeholder="argv command, e.g. python -m pytest -q" />
          <button>Run approved</button>
        </form>
      </section>
      <aside id="agent-pane">
        <nav id="panel-nav">
          <button data-panel="context">Context</button>
          <button data-panel="approvals">Approvals</button>
          <button data-panel="commands">Commands</button>
          <button data-panel="market">Market</button>
          <button data-panel="models">Models</button>
          <button data-panel="chat">Chat</button>
        </nav>
        <div id="product-panel" hidden></div>
        <div id="messages"></div>
        <details id="chat-thinking" hidden>
          <summary>Thinking</summary>
          <pre id="chat-thinking-steps"></pre>
        </details>
        <div id="proposal"></div>
        <label id="idle-self-dev-label" class="opt-in" title="Когда LLM свободен ≥3 мин — один C.14 propose+sandbox → Approvals. Без apply на main. Prefs общие с Qt.">
          <input type="checkbox" id="idle-self-dev" />
          Саморазвитие в простое LLM
        </label>
        <form id="chat-form">
          <div id="prompt-wrap">
            <textarea id="prompt" placeholder="Ask Eurika…  (@module / @smell)"></textarea>
            <ul id="mention-popup" hidden></ul>
          </div>
          <button id="clear-chat" type="button">Clear</button>
          <button id="cancel-chat" type="button" disabled>Cancel</button>
          <button id="send-chat">Send</button>
        </form>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
