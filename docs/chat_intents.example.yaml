# Chat intents config — copy to .eurika/config/chat_intents.yaml
#
# Eurika ships a hardcoded default for greeting / project_overview /
# file_recount / project_tree / scan / project_ls / identity (см.
# eurika/api/chat_intents_default.py). Этот файл — пример того, что можно
# переопределить или добавить.
#
# Правила слияния:
#   - intent_id: <spec>     — заменяет дефолтный intent целиком
#   - intent_id: null       — выключает дефолтный intent
#   - top-level (version, intent_hints, question_prefix, vector_min_similarity)
#     — пользовательское значение перезаписывает дефолт.
#
# Engine:
#   - patterns: substring match (или regex, если match_mode: regex)
#   - exact: точное совпадение
#   - require: все подстроки должны присутствовать
#   - exclude / exclude_prefix: пропускать intent при совпадении
#   - emit: команда для эха в Terminal (или null)
#
# CR-G2: vector fuzzy match (EURIKA_USE_VECTOR_INTENT=1) — vector_exemplars.

version: 1

# CR-G2: Cosine similarity threshold for fuzzy match. 0.68–0.85. Lower = more permissive.
# Env override: EURIKA_VECTOR_MIN_SIM
vector_min_similarity: 0.72

# Подсказки для LLM (русский). Используется в промпте, если задано.
intent_hints: |
  - Коммит → «собери коммит»: git status+diff, затем «применяй».
  - Ритуал → «проведи ритуал» или «прогони scan doctor»: eurika scan . → doctor . → report-snapshot . → fix .
  - Отчёт → «покажи отчёт»: отображение doctor report.
  - Рефакторинг → «рефактори» + путь, или eurika fix .
  - Release check → «прогони release check»: ./scripts/release_check.sh
  - Файлы → «выполни ls» или «покажи структуру проекта».
  - Путь сохранённого → «покажи полный путь к файлу» после «сохрани в ...».

# ROADMAP 3.6.8 Phase 5: Question-like messages skip direct handlers → LLM answers
# If message matches, no ritual/run_command/release_check; user gets explanation, not execution.
question_prefix: "^(что|как|зачем|почему|чем|где|какой|какие|каков|в\\s*ч[её]м|when|why|what|how|where|which)\\s"

intents:
  # ----- Factual intents (provided by default, override here as needed) -----

  greeting:
    match_mode: regex
    patterns:
      - "^\\s*привет[!.…]*\\s*$"
      - "^\\s*здравствуй"
      - "^\\s*добрый\\s+(день|вечер|утро)"
      - "^\\s*hello[!.]*\\s*$"
      - "^\\s*hi[!.]*\\s*$"
    emit: null

  project_overview:
    patterns:
      - "что за проект"
      - "что это за проект"
      - "опиши проект"
      - "расскажи о проекте"
      - "what is this project"
      - "describe the project"
    vector_exemplars:
      - "что за проект открыт?"
      - "опиши проект"
      - "describe this project"
    emit: null

  file_recount:
    match_mode: regex
    patterns:
      - "сколько\\s+(?:\\w+\\s+){0,6}файл"
      - "сколько\\s+(?:\\w+\\s+){0,6}модул"
      - "(?:пере|под|по)счита\\w*\\s+(?:\\w+\\s+){0,6}файл"
      - "how\\s+many\\s+(?:\\w+\\s+){0,4}files?"
      - "\\bпересчита"
    emit: null

  list_docs:
    patterns:
      - "какие документ"
      - "какая документация"
      - "покажи документ"
      - "список документ"
      - "list docs"
      - "show documentation"
      - "what docs"
    emit: null

  scan:
    patterns:
      - "просканируй"
      - "прогони scan"
      - "запусти scan"
      - "сканируй проект"
      - "eurika scan"
      - "run scan"
    exclude:
      - "дерево"
      - "структур"
      - "выполни команд"
      - "execute command"
      - "run command"
    emit: "$ eurika scan ."

  # ----- Workflow intents -----

  show_report:
    patterns:
      - "покажи отчёт"
      - "покажи отчет"
      - "сформируй отчет"
      - "сформируй отчёт"
      - "посмотри результат"
      - "покажи результат"
      - "show report"
      - "doctor report"
      - "scan report"
      - "результат scan"
      - "результат doctor"
    vector_exemplars:
      - "покажи отчёт"
      - "покажи результат анализа"
      - "покажи отчёт по проекту"
      - "сформируй отчёт doctor"
      - "дай отчёт doctor"
      - "отчёт по анализу"
      - "report please"
      - "show me the doctor report"
      - "scan report"
    emit: null

  ritual:
    patterns:
      - "проведи ритуал"
      - "прогони ритуал"
      - "запусти ритуал"
      - "run ritual"
      - "прогони scan"
      - "запусти scan doctor"
      - "scan doctor"
      - "scan → doctor"
      - "eurika scan"
      - "eurika doctor"
      - "report-snapshot"
    vector_exemplars:
      - "проведи ритуал"
      - "прогони ритуал"
      - "запусти ритуал"
      - "прогони scan doctor report-snapshot"
      - "запусти scan doctor"
      - "run full ritual"
      - "eurika scan doctor"
    emit: "$ eurika scan . && eurika doctor . && eurika report-snapshot ."

  release_check:
    patterns:
      - "прогони release check"
      - "прогони release_check"
      - "прогони release-check"
      - "прогони releasecheck"
      - "run release check"
      - "запусти release check"
      - "выполни release check"
      - "release check"
      - "release_check"
    vector_exemplars:
      - "прогони release check"
      - "прогони release_check"
      - "запусти release check"
      - "выполни release check"
      - "run release check"
    emit: "$ ./scripts/release_check.sh"

  smoke_test:
    patterns:
      - "проведи smoke"
      - "прогони smoke"
      - "запусти smoke"
      - "выполни smoke"
      - "smoke test"
      - "smoke-test"
      - "смоук тест"
      - "проведи смоук"
      - "qt smoke"
      - "run smoke"
      - "run smoke test"
    exact:
      - "smoke"
      - "smoke test"
    vector_exemplars:
      - "проведи smoke test"
      - "запусти smoke"
      - "run smoke test"
      - "qt smoke"
    emit: null

  host_health:
    patterns:
      - "здоровье ос"
      - "здоровье системы"
      - "операционку"
      - "операционка"
      - "проверь ос"
      - "проверь arch"
      - "host health"
      - "os health"
      - "system health"
    vector_exemplars:
      - "проверь операционку"
      - "здоровье ОС Arch"
      - "нагрузка системы"
      - "host health check"
    emit: null

  self_check:
    patterns:
      - "проведи self-check"
      - "прогони self-check"
      - "запусти self-check"
      - "self-check"
      - "self check"
      - "eurika self-check"
      - "окружение eurika"
      - "окружение проекта"
    exact:
      - "self-check"
      - "self check"
    emit: "$ eurika self-check ."

  roadmap_verify:
    patterns:
      - "проверь фазу"
      - "сверь roadmap"
      - "verify phase"
      - "проверь 2.7"
      - "сверь roadmap с фазами"
    exclude:
      - "операционк"
      - "железо"
      - "hardware"
    vector_exemplars:
      - "проверь фазу 2.7"
      - "сверь roadmap"
      - "проверь фазу"
      - "сверь с roadmap"
      - "verify phase 3.0"
    emit: null

  git_commit:
    patterns:
      - "собери коммит"
      - "сделай коммит"
      - "создай коммит"
      - "закоммить"
      - "закоммит"
      - "собери commit"
      - "сделай commit"
      - "commit changes"
      - "commit the changes"
      - "git commit"
      - "git status"
      - "git diff"
      - "покажи status"
      - "покажи diff"
    vector_exemplars:
      - "собери коммит"
      - "сделай коммит"
      - "закоммить изменения"
      - "создай коммит"
      - "сделай commit"
      - "commit the changes"
      - "покажи git status"
    emit: null

  project_ls:
    patterns:
      - " ls "
      - "команду ls"
      - "выполни ls"
      - "run ls"
      - "execute ls"
      - "list root"
      - "list files"
      - "покажи файлы"
      - "содержимое каталог"
      - "содержимое папк"
      - "содержимое проект"
      - "список файлов"
      - "list directory"
    exact: ["ls"]
    vector_exemplars:
      - "выполни ls"
      - "покажи файлы в корне"
      - "покажи содержимое каталога проекта"
      - "list root files"
      - "команду ls"
    emit: "$ ls -la"

  project_tree:
    patterns:
      - "покажи структ"
      - "покажи дерево"
      - "какая структура"
      - "структуру проекта"
      - "фактическую структуру"
      - "tree"
      - "project structure"
      - "folder structure"
    vector_exemplars:
      - "покажи структуру проекта"
      - "покажи дерево каталогов"
      - "какая структура проекта"
      - "покажи фактическую структуру"
      - "project structure"
    emit: "$ eurika project-tree ."

  saved_file_path:
    patterns:
      - "полный путь к файлу"
      - "полный путь к последнему"
      - "full path of file"
      - "absolute path"
      - "где сохранён файл"
    vector_exemplars:
      - "покажи полный путь к файлу"
      - "где сохранён последний файл"
      - "full path of saved file"
    emit: null

  add_api_test:
    patterns:
      - "добавь тест"
      - "тест для endpoint"
      - "покрой тестами /api"
      - "тест для /api"
      - "test for /api"
    require: ["/api"]
    vector_exemplars:
      - "добавь тест для /api/summary"
      - "тест для endpoint /api/chat"
      - "покрой тестами /api/summary"
      - "test for /api/chat endpoint"
    emit: null

  add_module_test:
    patterns:
      - "добавь тест"
      - "тест для модуля"
      - "покрой тестами"
      - "test for module"
    exclude: ["/api"]
    vector_exemplars:
      - "добавь тест для eurika/api/serve.py"
      - "тест для модуля eurika.api.serve"
      - "покрой тестами eurika/polygon/long_function"
      - "test for eurika.api.serve"
    emit: null

  show_file:
    patterns:
      - "покажи файл"
      - "покажи содержимое"
      - "открой файл"
      - "прочитай файл"
      - "show file"
      - "read file"
      - "open file"
    vector_exemplars:
      - "покажи файл eurika/api/chat.py"
      - "открой файл docs/ROADMAP.md"
      - "прочитай файл"
      - "покажи содержимое файла"
      - "show file docs/ROADMAP.md"
    emit: null

  identity:
    match_mode: regex
    patterns:
      - '^\\s*ты\\s+кто\\??\\s*$'
      - '^\\s*кто\\s+ты(\\s+такой)?\\??\\s*$'
      - '^\\s*кто\\s+(твой|ваш)\\s+создател\\w*\\??\\s*$'
      - '^\\s*кто\\s+автор(\\s+(этого\\s+)?(проекта|программы|кода|eurika))?\\??\\s*$'
      - '^\\s*кто\\s+тебя\\s+(создал|сделал|написал|разработал)\\??\\s*$'
      - '^\\s*кто\\s+(создал|сделал|написал|разработал)\\s+тебя\\??\\s*$'
      - '^\\s*кто\\s+(создал|сделал|написал|разработал)\\s+(твой|ваш)\\s+\\w+\\??\\s*$'
      - '^\\s*кто\\s+(создал|сделал|написал|разработал)\\s+(эту|этот)\\s+(программ\\w*|проект\\w*|код\\w*|ассистент\\w*)\\??\\s*$'
      - '^\\s*кто\\s+(создал|сделал|написал|разработал)\\s+eurika\\??\\s*$'
      - '^\\s*who\\s+are\\s+you\\??\\s*$'
      - '^\\s*what\\s+are\\s+you\\??\\s*$'
      - '^\\s*who\\s+is\\s+your\\s+(creator|author)\\??\\s*$'
      - '^\\s*who\\s+(created|made|built|wrote|coded|developed)\\s+you\\??\\s*$'
      - '^\\s*who\\s+(created|made|built|wrote|coded|developed)\\s+your\\s+\\w+\\??\\s*$'
      - '^\\s*who\\s+(created|made|built|wrote|coded|developed)\\s+this\\s+(program|project|code|assistant)\\??\\s*$'
    exact:
      - "ты кто"
      - "кто ты"
      - "кто тебя создал"
      - "кто твой создатель"
      - "кто написал твой код"
      - "кто написал эту программу"
      - "who are you"
      - "who created you"
      - "who wrote your code"
      - "who wrote this program"
    vector_exemplars:
      - "ты кто"
      - "кто ты такой"
      - "кто тебя создал"
      - "кто твой создатель"
      - "кто написал твой код"
      - "кто написал эту программу"
      - "кто автор проекта"
      - "who are you"
      - "who created you"
      - "who wrote your code"
      - "who wrote this program"
    emit: null
